<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTDR Profit Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* বেসিক স্টাইল */
    body {
      font-family: 'Noto Sans Bengali', sans-serif;
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: #1b4332;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    /* স্লিম ল্যান্ডস্কেপ কন্টেইনার */
    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      border: 1px solid #cbf3d1;
      margin-top: 10px;
    }

    .bank-header h1 {
      font-size: 1.1rem;
      margin: 0;
      color: #0c6b3a;
    }

    .bank-header p {
      font-size: 0.75rem;
      margin: 2px 0 12px 0;
      color: #555;
    }

    /* ইনপুট সেকশন */
    .input-section {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #a0d3a2;
      border-radius: 6px;
      font-size: 1.1rem;
      background: #f8fff9;
      color: #0f5132;
      outline: none;
      text-align: center;
      box-sizing: border-box;
      font-weight: 700;
      letter-spacing: 1px;
    }

    input:focus {
      border-color: #00b09b;
      background: #fff;
    }

    /* লেবেল */
    .label-text {
      font-size: 0.8rem;
      font-weight: 600;
      color: #145a32;
      margin-bottom: 6px;
      display: block;
      text-align: left;
    }

    /* মেয়াদ গ্রিড */
    .tenure-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }

    /* কার্ড বাটন */
    .tenure-card {
      background: #fff;
      border: 1px solid #d4efdf;
      border-radius: 5px;
      padding: 4px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 40px;
    }

    .tenure-card h3 {
      font-size: 0.7rem;
      margin: 0;
      font-weight: 600;
      line-height: 1.2;
    }
    
    .tenure-card p {
      font-size: 0.6rem;
      margin: 1px 0 0 0;
      color: #666;
    }

    .tenure-card:hover {
      border-color: #00b09b;
      background: #f0fff4;
    }

    .tenure-card.active {
      background: linear-gradient(135deg, #00b09b, #2ecc71);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 176, 155, 0.3);
    }

    .tenure-card.active p {
      color: #e8f5e9;
    }

    /* ক্যালকুলেট বাটন */
    .calculate-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(to right, #00b09b, #2ecc71);
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .calculate-btn:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #666;
    }
    .footer a { text-decoration: none; color: #0c6b3a; font-weight: bold; }

    /* রেসপন্সিভ */
    @media (min-width: 500px) {
      .tenure-grid {
        grid-template-columns: repeat(5, 1fr);
      }
      .container {
        margin-top: 40px;
      }
    }

    /* ================= POPUP STYLES ================= */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .popup-content {
      background: #fff;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      border-top: 5px solid #00b09b;
      opacity: 0;
      transform: scale(0.7);
    }

    .popup-overlay.active { display: flex; }

    .popup-overlay.active .popup-content {
      animation: popupBounce 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
    }

    @keyframes popupBounce {
      0% { opacity: 0; transform: scale(0.7) translateY(50px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 24px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #e74c3c; }

    .popup-header {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0c6b3a;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 1px dashed #bdecb6;
      padding-bottom: 8px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 4px;
    }
    .result-item span:last-child { color: #0c6b3a; font-weight: 700; }
    
    .note {
      font-size: 0.75rem;
      margin-top: 12px;
      color: #e67e22;
      text-align: center;
      background: #fff8f0;
      padding: 6px;
      border-radius: 4px;
    }

    .close-popup-btn {
      width: 100%;
      margin-top: 12px;
      background: #e74c3c;
      padding: 8px;
      font-size: 0.9rem;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* লোডিং এনিমেশন স্টাইল */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00b09b;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="bank-header">
      <h1>ইসলামি ব্যাংক বাংলাদেশ পিএলসি</h1>
      <p>MTDR মুনাফা হিসাবকারী</p>
    </div>

    <div class="input-section">
      <!-- ডিফল্ট ইংরেজি ইনপুট ফিল্ড -->
      <input type="text" inputmode="numeric" id="amount" placeholder="20,000" autocomplete="off" />
    </div>

    <span class="label-text">মেয়াদ নির্বাচন করুন:</span>
    <div class="tenure-grid">
      <div class="tenure-card" onclick="selectPlan(this, 5.25, 30, '১ মাস')">
        <h3>১ মাস</h3><p>৫.২৫%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 9.50, 90, '৩ মাস')">
        <h3>৩ মাস</h3><p>৯.৫০%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 9.60, 100, '১০০ দিন')">
        <h3>১০০ দিন</h3><p>৯.৬০%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 9.80, 180, '৬ মাস')">
        <h3>৬ মাস</h3><p>৯.৮০%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 9.90, 200, '২০০ দিন')">
        <h3>২০০ দিন</h3><p>৯.৯০%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 9.95, 300, '৩০০ দিন')">
        <h3>৩০০ দিন</h3><p>৯.৯৫%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 10.00, 365, '১২ মাস')">
        <h3>১২ মাস</h3><p>১০.০০%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 10.20, 730, '২৪ মাস')">
        <h3>২৪ মাস</h3><p>১০.২০%</p>
      </div>
      <div class="tenure-card" onclick="selectPlan(this, 10.50, 1095, '৩৬ মাস')">
        <h3>৩৬ মাস</h3><p>১০.৫০%</p>
      </div>
    </div>

    <button class="calculate-btn" onclick="calculateProfit()">হিসাব করুন</button>

    <div class="footer">
      Developed by <a href="https://www.facebook.com/share/1K6Esz6k76/" target="_blank">Rubel Mahmud</a>
    </div>
  </div>

  <div id="popupOverlay" class="popup-overlay" onclick="closePopupOutside(event)">
    <div class="popup-content">
      <span class="close-btn" onclick="closePopup()">&times;</span>
      <div id="popupBody"></div>
    </div>
  </div>

  <script>
    let currentRate = 0;
    let currentDuration = 0;
    let selectedText = "";

    // ইনপুটে ইংরেজিতে কমা (Comma) বসানোর ফাংশন
    document.getElementById('amount').addEventListener('input', function(e) {
      // শুধু ইংরেজি নাম্বার এলাও করবে (0-9 বাদে সব মুছে ফেলবে)
      let value = e.target.value.replace(/[^0-9]/g, '');
      
      if (value) {
        // কমা যুক্ত করা হচ্ছে (Indian/South Asian Format)
        e.target.value = parseInt(value, 10).toLocaleString('en-IN');
      } else {
        e.target.value = '';
      }
    });

    // ফলাফলে দেখানোর জন্য ইংরেজি থেকে বাংলা সংখ্যায় রূপান্তরের ফাংশন
    function convertToBangla(str) {
      const banglaDigits = {
        '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', 
        '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯'
      };
      
      return str.toString().replace(/[0-9]/g, function(w) {
        return banglaDigits[w];
      });
    }

    function selectPlan(element, rate, duration, text) {
      const cards = document.querySelectorAll('.tenure-card');
      cards.forEach(card => card.classList.remove('active'));
      element.classList.add('active');
      currentRate = rate;
      currentDuration = duration;
      selectedText = text;
    }

    function showPopup(content) {
      const popupBody = document.getElementById('popupBody');
      const popupOverlay = document.getElementById('popupOverlay');
      popupBody.innerHTML = content;
      popupOverlay.classList.add('active');
    }

    function closePopup() {
      document.getElementById('popupOverlay').classList.remove('active');
    }

    function closePopupOutside(event) {
      if (event.target.id === 'popupOverlay') {
        closePopup();
      }
    }

    function calculateProfit() {
      // ইনপুট থেকে কমা সরিয়ে সাধারণ নাম্বারে কনভার্ট করা হচ্ছে
      let rawAmount = document.getElementById('amount').value;
      let cleanAmount = rawAmount.replace(/,/g, ''); 
      const amount = parseFloat(cleanAmount);

      if (isNaN(amount) || currentRate === 0 || currentDuration === 0) {
        showPopup(`
          <div class="popup-header" style="color:#e74c3c;">⚠️ ত্রুটি!</div>
          <div style="text-align:center; color:#555; font-size:0.9rem; margin-bottom:15px;">
            টাকার পরিমাণ লিখুন এবং মেয়াদ নির্বাচন করুন।
          </div>
          <button class="close-popup-btn" onclick="closePopup()">বন্ধ করুন</button>
        `);
        return;
      }

      if (amount <= 0) {
        showPopup(`
          <div class="popup-header" style="color:#e74c3c;">⚠️ অবৈধ মান!</div>
          <div style="text-align:center; color:#555; font-size:0.9rem;">মাইনাস বা শূন্য মান গ্রহণযোগ্য নয়।</div>
          <button class="close-popup-btn" onclick="closePopup()">ঠিক আছে</button>
        `);
        return;
      }

      if (amount < 20000) {
        showPopup(`
          <div class="popup-header" style="color:#e74c3c;">⚠️ লক্ষ্য করুন</div>
          <div style="text-align:center; color:#555; font-size:0.9rem;">২০,০০০ টাকার কম আমানত গ্রহণ করা হয় না।</div>
          <button class="close-popup-btn" onclick="closePopup()">ঠিক আছে</button>
        `);
        return;
      }

      // লোডিং স্ক্রিন দেখানো
      showPopup(`
        <div class="popup-header" style="border: none; margin-bottom: 0;">হিসাব করা হচ্ছে...</div>
        <div class="loader"></div>
      `);

      // ০.৫ সেকেন্ড (500ms) ডিলে করে ফলাফল দেখানো
      setTimeout(() => {
        const yearlyProfit = (amount * currentRate) / 100;
        const totalProfit = (yearlyProfit * currentDuration) / 365;
        const vat15 = totalProfit * 0.15;
        const vat10 = totalProfit * 0.10;
        const netProfit15 = totalProfit - vat15;
        const netProfit10 = totalProfit - vat10;

        // ইংরেজিতে কমা সহ ফরমেট করে তারপর বাংলায় কনভার্ট
        const bdAmount = convertToBangla(amount.toLocaleString('en-IN'));
        const bdRate = convertToBangla(currentRate.toString());
        const bdTotalProfit = convertToBangla(totalProfit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}));
        const bdNet15 = convertToBangla(netProfit15.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}));
        const bdNet10 = convertToBangla(netProfit10.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}));

        const resultHtml = `
          <div class="popup-header">হিসাবের ফলাফল</div>
          <div class="result-item"><span>নির্বাচিত মেয়াদ:</span><span>${selectedText}</span></div>
          <div class="result-item"><span>মুনাফা হার:</span><span>${bdRate}%</span></div>
          <div class="result-item"><span>মূল টাকা:</span><span>${bdAmount} টাকা</span></div>
          <div class="result-item" style="border-bottom: 2px dashed #bdecb6;"><span>মোট মুনাফা:</span><span>${bdTotalProfit} টাকা</span></div>
          <div class="result-item"><span>১৫% ভ্যাট বাদে:</span><span>${bdNet15} টাকা</span></div>
          <div class="result-item"><span>১০% ভ্যাট বাদে (TIN):</span><span>${bdNet10} টাকা</span></div>
          <div class="note">TIN থাকলে ১০% ভ্যাট, না থাকলে ১৫% ভ্যাট কাটা হবে।</div>
          <button class="close-popup-btn" style="background:#00b09b;" onclick="closePopup()">নতুন হিসাব করুন</button>
        `;

        // লোডিং শেষ করে ফলাফল আপডেট করা
        document.getElementById('popupBody').innerHTML = resultHtml;
      }, 500);
    }
  </script>
</body>
</html>
