<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTDR Profit Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans Bengali', sans-serif;
      background: linear-gradient(to right, #00b09b, #96c93d);
      color: #1b4332;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #f8fff9;
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      text-align: center;
      border: 1px solid #b5e7b1;
    }

    .bank-header h1 {
      font-size: 1.2rem;
      margin-bottom: 4px;
      color: #0c6b3a;
    }

    .bank-header p {
      font-size: 0.9rem;
      margin: 0 0 14px;
      color: #2f6d37;
    }

    h2 {
      font-size: 1.3rem;
      color: #145a32;
      margin-bottom: 16px;
      position: relative;
    }

    h2::after {
      content: "";
      position: absolute;
      width: 45px;
      height: 2.5px;
      background: #00b09b;
      left: 50%;
      transform: translateX(-50%);
      bottom: -6px;
      border-radius: 3px;
    }

    label {
      text-align: left;
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #145a32;
      margin: 10px 0 4px;
    }

    select,
    input[type="number"] {
      width: 94%;
      padding: 8px 10px;
      border: 1px solid #a0d3a2;
      border-radius: 6px;
      font-size: 0.9rem;
      background: #f0fff4;
      color: #0f5132;
      outline: none;
      transition: all 0.2s;
    }

    select:focus,
    input:focus {
      border-color: #00b09b;
      box-shadow: 0 0 3px #96c93d;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(to right, #00b09b, #2ecc71);
      cursor: pointer;
      transition: all 0.25s;
    }

    button:hover {
      background: linear-gradient(to right, #009e88, #28b463);
      transform: translateY(-1px);
    }

    #result {
      display: none;
      margin-top: 16px;
      background: #ecfdf3;
      border: 1px solid #c8f3c2;
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      color: #064d1c;
      font-size: 0.9rem;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      border-bottom: 1px dashed #bdecb6;
      margin-bottom: 6px;
      padding-bottom: 3px;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #4b7355;
    }

    .footer a {
      color: #0c6b3a;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .container {
        margin-top: 10px;
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bank-header">
      <h1>ইসলামি ব্যাংক বাংলাদেশ পিএলসি</h1>
      <p>MTDR অ্যাকাউন্টের মুনাফা হিসাব</p>
    </div>

    <h2>মুনাফা হিসাবকারী</h2>

    <label for="plan">একটি মেয়াদ নির্বাচন করুন:</label>
    <select id="plan" onchange="setRateAndDuration()">
      <option value="">-- নির্বাচন করুন --</option>
      <option value="1m">01 Month - 5.25%</option>
      <option value="3m">03 Months - 9.50%</option>
      <option value="100d">100 Days - 9.60%</option>
      <option value="6m">06 Months - 9.80%</option>
      <option value="200d">200 Days - 9.90%</option>
      <option value="300d">300 Days - 9.95%</option>
      <option value="12m">12 Months - 10.00%</option>
      <option value="24m">24 Months - 10.20%</option>
      <option value="36m">36 Months - 10.50%</option>
    </select>

    <label for="amount">টাকার পরিমাণ (Amount):</label>
    <input type="number" id="amount" placeholder="Amount (টাকা)" />

    <button onclick="calculateProfit()">হিসাব করুন</button>

    <div id="result"></div>

    <div class="footer">
      Developed by <a href="https://www.facebook.com/share/1K6Esz6k76/" target="_blank">Rubel Mahmud</a>
    </div>
  </div>

  <script>
    let currentRate = 0;
    let currentDuration = 0;
    let selectedText = "";

    function setRateAndDuration() {
      const plan = document.getElementById('plan');
      selectedText = plan.options[plan.selectedIndex].text.split('-')[0].trim(); // শুধু মেয়াদ অংশ নেবে

      switch (plan.value) {
        case '1m': currentRate = 5.25; currentDuration = 30; break;
        case '3m': currentRate = 9.50; currentDuration = 90; break;
        case '100d': currentRate = 9.60; currentDuration = 100; break;
        case '6m': currentRate = 9.80; currentDuration = 180; break;
        case '200d': currentRate = 9.90; currentDuration = 200; break;
        case '300d': currentRate = 9.95; currentDuration = 300; break;
        case '12m': currentRate = 10.00; currentDuration = 365; break;
        case '24m': currentRate = 10.20; currentDuration = 730; break;
        case '36m': currentRate = 10.50; currentDuration = 1095; break;
        default: currentRate = 0; currentDuration = 0;
      }
    }

    function calculateProfit() {
      const amount = parseFloat(document.getElementById('amount').value);
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';

      if (isNaN(amount) || currentRate === 0 || currentDuration === 0) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<div style="color:red;">অনুগ্রহ করে টাকার পরিমাণ দিন এবং মেয়াদ নির্বাচন করুন।</div>';
        return;
      }

      if (amount <= 0) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<div style="color:red;">মাইনাস বা শূন্য মান গ্রহণযোগ্য নয়।</div>';
        return;
      }

      if (amount < 20000) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<div style="color:red;">২০,০০০ এর বেশি অ্যামাউন্ট দিন।</div>';
        return;
      }

      const yearlyProfit = (amount * currentRate) / 100;
      const totalProfit = (yearlyProfit * currentDuration) / 365;
      const vat15 = totalProfit * 0.15;
      const vat10 = totalProfit * 0.10;
      const netProfit15 = totalProfit - vat15;
      const netProfit10 = totalProfit - vat10;

      resultDiv.innerHTML = `
        <div class="result-item"><span>নির্বাচিত মেয়াদ:</span><span>${selectedText}</span></div>
        <div class="result-item"><span>মুনাফা হার:</span><span>${currentRate}%</span></div>
        <div class="result-item"><span>মূল টাকা:</span><span>${amount.toLocaleString()} টাকা</span></div>
        <div class="result-item"><span>মোট সম্ভাব্য মুনাফা (ভ্যাটের আগে):</span><span>${totalProfit.toFixed(2)} টাকা</span></div>
        <div class="result-item"><span>১৫% ভ্যাট কাটার পর:</span><span>${netProfit15.toFixed(2)} টাকা</span></div>
        <div class="result-item"><span>১০% ভ্যাট কাটার পর (TIN থাকলে):</span><span>${netProfit10.toFixed(2)} টাকা</span></div>
        <p style="font-size:0.8rem;margin-top:8px;color:#1b4d2c;">বিঃদ্রঃ TIN থাকলে ১০% ভ্যাট কাটা হবে।</p>
      `;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
